name: Notify failures

# Posts to Slack when the automated update pipeline fails:
# - Renovate itself,
# - CI on main or on a Renovate branch (a failing check blocks the automerge),
# - the image build and push.
#
# Requires the SLACK_WEBHOOK_URL secret (a Slack incoming webhook). Without
# it the job only logs a warning.
on:
  workflow_run:
    workflows: [CI, Build and push images, Renovate]
    types: [completed]

permissions: {}

jobs:
  slack:
    if: >-
      contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_repository.full_name == github.repository && (
        github.event.workflow_run.name != 'CI' ||
        github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'renovate/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [[ -z "$SLACK_WEBHOOK_URL" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set, skipping the Slack notification"
            exit 0
          fi
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg workflow "$WORKFLOW" \
            --arg conclusion "$CONCLUSION" \
            --arg branch "$BRANCH" \
            --arg url "$RUN_URL" \
            --arg commit "${COMMIT_MESSAGE%%$'\n'*}" \
            '{text: ":x: *\($repository)*: \($workflow) \($conclusion) on `\($branch)`\n\($commit)\n<\($url)|View run>"}' |
            curl -fsS --retry 3 -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
