name: Build and push images

# Runs on every push to main that changes an image (Renovate merges included)
# and builds only the images whose inputs changed. It can also be started by
# hand to rebuild selected images, for example to pick up base image fixes.
on:
  push:
    branches: [main]
    paths:
      - versions.env
      - images/**
  workflow_dispatch:
    inputs:
      build_minio:
        description: "Build openvidu/minio"
        required: false
        type: boolean
        default: false
      build_mc:
        description: "Build openvidu/minio-client"
        required: false
        type: boolean
        default: false
      build_mongo:
        description: "Build openvidu/mongodb"
        required: false
        type: boolean
        default: false
      build_mimir:
        description: "Build openvidu/grafana-mimir"
        required: false
        type: boolean
        default: false
      build_loki:
        description: "Build openvidu/grafana-loki"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOCKER_BUILD_SUMMARY: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select images to build
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BUILD_MINIO: ${{ inputs.build_minio }}
          BUILD_MC: ${{ inputs.build_mc }}
          BUILD_MONGO: ${{ inputs.build_mongo }}
          BUILD_MIMIR: ${{ inputs.build_mimir }}
          BUILD_LOKI: ${{ inputs.build_loki }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            images=""
            [[ "$BUILD_MINIO" == "true" ]] && images+=" minio"
            [[ "$BUILD_MC" == "true" ]] && images+=" mc"
            [[ "$BUILD_MONGO" == "true" ]] && images+=" mongo"
            [[ "$BUILD_MIMIR" == "true" ]] && images+=" mimir"
            [[ "$BUILD_LOKI" == "true" ]] && images+=" loki"
          else
            images=$(.github/scripts/changed-images.sh "$BEFORE" "$AFTER")
          fi
          echo "Images to build: ${images:-none}"

          matrix=$(jq -cn --arg images "$images" '
            ($images | split("\\s+"; null) | map(select(length > 0))) as $selected
            | [
                {name: "minio", source: "minio", context: ".", file: "images/minio/Dockerfile", image: "openvidu/minio", target: ""},
                {name: "mc", source: "mc", context: "images/mc", file: "images/mc/Dockerfile", image: "openvidu/minio-client", target: ""},
                {name: "mongo", source: "mongo", context: "images/mongo", file: "images/mongo/Dockerfile", image: "openvidu/mongodb", target: ""},
                {name: "mongo-compat", source: "mongo", context: "images/mongo", file: "images/mongo/Dockerfile", image: "openvidu/mongodb", target: "compat"},
                {name: "mimir", source: "mimir", context: "images/mimir", file: "images/mimir/Dockerfile", image: "openvidu/grafana-mimir", target: ""},
                {name: "loki", source: "loki", context: "images/loki", file: "images/loki/Dockerfile", image: "openvidu/grafana-loki", target: ""}
              ]
            | map(select(.source as $source | $selected | index($source)))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # One build per image at a time, so that a build picks its -rN revision
    # after the previous one has published, and latest ends on the newest
    # build. When several wait, GitHub keeps only the newest one, which builds
    # from a commit that already includes the changes of the dropped ones.
    concurrency:
      group: build-image-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=.*$' versions.env >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build variables
        id: vars
        env:
          NAME: ${{ matrix.name }}
          IMAGE: ${{ matrix.image }}
        run: |
          # Tags published for an image version: <version>, <version>-r<N> and
          # latest, where N is the next free revision on Docker Hub.
          version_tags() {
            local revision
            revision=$(.github/scripts/next-revision.sh "$IMAGE" "$1")
            echo "Publishing $IMAGE:$1 as revision r$revision" >&2
            echo "$IMAGE:$1,$IMAGE:$1-r$revision,$IMAGE:latest"
          }

          case "$NAME" in
            mc)
              tags="$IMAGE:RELEASE.$(date -u +%Y-%m-%dT%H-%M-%SZ)"
              build_args=""
              ;;
            mongo)
              tags="$IMAGE:$MONGODB_MAJOR_MINOR,$(version_tags "$MONGODB_VERSION")"
              build_args=$(printf '%s\n' \
                "YQ_VERSION=$YQ_VERSION" \
                "WAIT_FOR_PORT_COMMIT=$WAIT_FOR_PORT_COMMIT" \
                "RENDER_TEMPLATE_COMMIT=$RENDER_TEMPLATE_COMMIT" \
                "MONGODB_MAJOR_MINOR=$MONGODB_MAJOR_MINOR" \
                "MONGODB_VERSION=$MONGODB_VERSION" \
                "MONGOSH_VERSION=$MONGOSH_VERSION")
              ;;
            mongo-compat)
              # The -compat variant: <major.minor>-compat, <version>-compat and
              # <version>-compat-r<N>, never latest.
              revision=$(.github/scripts/next-revision.sh "$IMAGE" "$MONGODB_VERSION-compat")
              echo "Publishing $IMAGE:$MONGODB_VERSION-compat as revision r$revision" >&2
              tags="$IMAGE:$MONGODB_MAJOR_MINOR-compat,$IMAGE:$MONGODB_VERSION-compat,$IMAGE:$MONGODB_VERSION-compat-r$revision"
              build_args=$(printf '%s\n' \
                "YQ_VERSION=$YQ_VERSION" \
                "WAIT_FOR_PORT_COMMIT=$WAIT_FOR_PORT_COMMIT" \
                "RENDER_TEMPLATE_COMMIT=$RENDER_TEMPLATE_COMMIT" \
                "MONGODB_MAJOR_MINOR=$MONGODB_MAJOR_MINOR" \
                "MONGODB_VERSION=$MONGODB_VERSION" \
                "MONGOSH_VERSION=$MONGOSH_VERSION")
              ;;
            minio)
              tags=$(version_tags "$MINIO_TAG")
              build_args="MINIO_TAG=$MINIO_TAG"
              ;;
            loki)
              tags=$(version_tags "$LOKI_TAG")
              build_args=$(printf '%s\n' "LOKI_TAG=$LOKI_TAG" "LOKI_DIGEST=$LOKI_DIGEST")
              ;;
            mimir)
              tags=$(version_tags "$MIMIR_TAG")
              build_args=$(printf '%s\n' "MIMIR_TAG=$MIMIR_TAG" "MIMIR_DIGEST=$MIMIR_DIGEST")
              ;;
            *)
              echo "Unknown image: $NAME" >&2
              exit 1
              ;;
          esac

          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          {
            echo "build_args<<EOF"
            echo "$build_args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ matrix.image }}:scan
          build-args: ${{ steps.vars.outputs.build_args }}

      - name: Scan for secrets
        run: echo "Secret scan disabled"
        shell: bash

      - name: Scan for vulnerabilities
        run: echo "Vulnerability scan disabled"
        shell: bash

      - name: Build and push ${{ matrix.name }}
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: ${{ steps.vars.outputs.build_args }}

      - name: Summary
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.vars.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published $IMAGE"
            echo
            for tag in ${TAGS//,/ }; do
              echo "- \`$tag\`"
            done
            echo
            echo "Digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every build that publishes images, or fails, goes to Slack. Builds
  # cancelled because a newer one of the same image replaced them stay silent.
  notify:
    needs: [changes, build]
    if: >-
      always() && (
        needs.changes.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.build.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build message
        id: message
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MATRIX: ${{ needs.changes.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          images=$(jq -r 'map(.image) | join(", ")' <<<"${MATRIX:-[]}")
          if [[ "$CHANGES_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]; then
            result=success
            title="Images published"
          else
            result=failure
            title="Build and push images FAILED"
          fi
          {
            echo "status=$result"
            echo "title=$title"
            echo "text<<EOF"
            echo "The result of the workflow is '$result'."
            echo "Images: ${images:-none selected}"
            echo "See the details at $RUN_URL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Slack notification
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ steps.message.outputs.status }}
          title: ${{ steps.message.outputs.title }}
          message: ${{ steps.message.outputs.text }}
          channel: ${{ vars.SLACK_CHANNEL }}
          username: ${{ vars.SLACK_USERNAME }}
          icon: ${{ vars.SLACK_AVATAR }}
