name: Renovate

# Renovate looks for new versions every Monday and opens or updates its PRs
# (configuration in renovate.json). It runs again whenever CI passes on one of
# its branches, so that a green PR is merged right away instead of waiting a
# week for the next scheduled run.
#
# Requires the RENOVATE_TOKEN secret: a fine-grained personal access token for
# this repository with read and write access to Contents, Pull requests,
# Issues, Workflows and Commit statuses, and read access to Dependabot
# alerts (Metadata read is always included). The
# default GITHUB_TOKEN is not enough: it cannot change workflow files, and
# pushes and merges made with it do not trigger CI or the image build.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: ["renovate/**"]
  workflow_dispatch:

permissions:
  contents: read
  # To list the PRs Renovate merged in the run, for Slack.
  pull-requests: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # After CI, only for green runs started by a push to a branch of this
    # repository. CI is not run for pull requests from forks.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    outputs:
      start: ${{ steps.start.outputs.time }}
    steps:
      - name: Note the start of the run
        id: start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # An exact version instead of the action's floating "44" image tag:
          # Renovate runs with write access to the repository.
          renovate-version: 44.210.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Docker Hub serves tag pages of 100 and answers page 11 of an
          # anonymous request with 403, and Renovate then drops every release
          # date of that image (mongo, golang and grafana/loki have more tags),
          # so the 3-day minimum age would hold their updates forever. The first
          # 10 pages hold the most recently pushed tags, the newest release
          # among them.
          RENOVATE_DOCKER_MAX_PAGES: "10"
          LOG_LEVEL: info

  # Slack gets the PRs Renovate merged in the run, and its failures.
  notify:
    needs: renovate
    if: always() && (needs.renovate.result == 'success' || needs.renovate.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: List the PRs Renovate merged
        id: merged
        if: needs.renovate.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_START: ${{ needs.renovate.outputs.start }}
        run: |
          merged=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 50 \
            --search "merged:>=$RUN_START" --json number,title,url,headRefName \
            --jq '.[] | select(.headRefName | startswith("renovate/"))
                       | "- \(.title) (#\(.number)): \(.url)"')
          echo "$merged"
          {
            echo "list<<EOF"
            echo "$merged"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Slack notification (Renovate merged)
        if: steps.merged.outputs.list != ''
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          title: Renovate merged
          message: |-
            Renovate merged in ${{ github.repository }}:
            ${{ steps.merged.outputs.list }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          channel: ${{ vars.SLACK_CHANNEL }}
          username: ${{ vars.SLACK_USERNAME }}
          icon: ${{ vars.SLACK_AVATAR }}

      - name: Slack notification (Renovate failed)
        if: needs.renovate.result == 'failure'
        uses: ./.github/actions/slack-notify
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          title: Renovate FAILED
          message: |-
            Renovate FAILED in ${{ github.repository }} (${{ github.event_name }}).
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          channel: ${{ vars.SLACK_CHANNEL }}
          username: ${{ vars.SLACK_USERNAME }}
          icon: ${{ vars.SLACK_AVATAR }}
